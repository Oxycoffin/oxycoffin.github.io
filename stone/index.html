<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>STONE</title><meta name="description" content="Esculpe una roca 3D directamente en el navegador."><link rel="stylesheet" href="./v5.css?v=5"></head><body><canvas id="stage" aria-label="Roca 3D interactiva"></canvas><div class="grain"></div><div class="brand">STONE</div><div class="actions"><button class="btn" id="saveBtn">Save</button><button class="btn" id="undoBtn">Undo</button><button class="btn" id="resetBtn">Reset</button></div><div class="status">soft clay · anti-collapse · 2 dedos = orbit + zoom</div><div class="hud"><div class="panel sliders"><div class="label">Size</div><input id="size" type="range" min="0.16" max="0.95" step="0.01" value="0.38"><div id="sizeVal" class="val">0.38</div><div class="label">Force</div><input id="force" type="range" min="0.003" max="0.040" step="0.001" value="0.013"><div id="forceVal" class="val">0.013</div></div><div class="panel tools"><button data-tool="carve" class="tool active">Carve</button><button data-tool="build" class="tool">Build</button><button data-tool="smooth" class="tool">Smooth</button><button data-tool="flatten" class="tool">Flatten</button><button data-tool="rotate" class="tool">Rotate</button></div></div><div id="toast" class="toast"></div><div id="error" class="error"></div><script type="module" src="./v5.js?v=5"></script></body></html>
