<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>STONE — Sculpt a Rock</title>
<style>
:root{--bg:#0c0d0f;--panel:rgba(20,21,24,.72);--line:rgba(255,255,255,.10);--text:#f2f1ec;--muted:#aaa9a3;--accent:#d6ff74}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{display:block}#app{position:fixed;inset:0}.grain{pointer-events:none;position:fixed;inset:0;opacity:.055;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}header{position:fixed;left:20px;right:20px;top:18px;display:flex;align-items:flex-start;justify-content:space-between;z-index:5;pointer-events:none}.brand{font-weight:800;letter-spacing:.18em;font-size:12px}.hint{font-size:12px;color:var(--muted);text-align:right;line-height:1.35}.toolbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:10;box-shadow:0 12px 40px rgba(0,0,0,.35)}button{appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);height:44px;padding:0 14px;border-radius:12px;font:600 13px/1 inherit;cursor:pointer}button:hover{color:var(--text);background:rgba(255,255,255,.05)}button.active{color:#0c0d0f;background:var(--accent)}button.reset{color:var(--text);border-color:var(--line)}.panel{position:fixed;left:18px;bottom:18px;width:190px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:9}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:12px}.row:last-child{margin-bottom:0}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.val{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace}input[type=range]{width:100%;grid-column:1/3;accent-color:var(--accent)}.badge{position:fixed;right:18px;bottom:18px;z-index:9;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px}@media(max-width:760px){header{left:14px;right:14px;top:14px}.hint{display:none}.panel{left:10px;bottom:78px;width:160px;padding:11px}.toolbar{bottom:10px;max-width:calc(100vw - 20px);overflow:auto;padding:6px;border-radius:16px}button{height:42px;padding:0 12px;white-space:nowrap}.badge{right:10px;bottom:78px}}
</style>
</head><body><div id="app"></div><div class="grain"></div><header><div class="brand">STONE / 01</div><div class="hint">Drag empty space to orbit<br>Drag the stone to sculpt</div></header><div class="panel"><div class="row"><div class="label">Brush size</div><div class="val" id="sizeVal">0.48</div><input id="size" type="range" min="0.15" max="0.95" step="0.01" value="0.48"></div><div class="row"><div class="label">Strength</div><div class="val" id="powerVal">0.060</div><input id="power" type="range" min="0.01" max="0.16" step="0.005" value="0.06"></div></div><div class="toolbar"><button data-tool="carve" class="active">Carve</button><button data-tool="raise">Raise</button><button data-tool="smooth">Smooth</button><button id="reset" class="reset">Reset</button></div><div class="badge">wheel / pinch = zoom</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/controls/OrbitControls.js';
const host=document.querySelector('#app'),scene=new THREE.Scene();scene.background=new THREE.Color(0x0c0d0f);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(.1,.1,6.2);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=3.6;controls.maxDistance=9;controls.enablePan=false;scene.add(new THREE.HemisphereLight(0xf0eadc,0x1a1b20,1.75));const key=new THREE.DirectionalLight(0xffffff,3.1);key.position.set(3,4,5);scene.add(key);const rim=new THREE.DirectionalLight(0x9db6ff,1.5);rim.position.set(-4,1,-3);scene.add(rim);const floor=new THREE.Mesh(new THREE.CircleGeometry(4.5,96),new THREE.ShadowMaterial({color:0x000000,opacity:.28}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.08;floor.receiveShadow=true;scene.add(floor);const mat=new THREE.MeshStandardMaterial({color:0x8e8d86,roughness:.94,metalness:.02,flatShading:false});let rock,original;function seededNoise(x,y,z){return Math.sin(x*2.13+y*1.31+z*.77)*.45+Math.sin(x*5.71-y*2.17+z*1.93)*.22+Math.cos(x*11.2+y*7.9-z*4.4)*.09}function makeRock(){const geo=new THREE.IcosahedronGeometry(1.75,5),p=geo.attributes.position,v=new THREE.Vector3();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const n=v.clone().normalize(),squash=1+seededNoise(n.x,n.y,n.z)*.10;v.multiplyScalar(squash);v.x*=1.08;v.y*=.95;v.z*=1.02;p.setXYZ(i,v.x,v.y,v.z)}geo.computeVertexNormals();original=new Float32Array(p.array);rock=new THREE.Mesh(geo,mat);rock.castShadow=true;rock.receiveShadow=true;rock.rotation.set(.1,-.35,.03);scene.add(rock)}makeRock();const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=false,sculpting=false,tool='carve',brush=.48,power=.06;const ring=new THREE.Mesh(new THREE.RingGeometry(.93,1,64),new THREE.MeshBasicMaterial({color:0xd6ff74,side:THREE.DoubleSide,transparent:true,opacity:.75,depthTest:false}));ring.visible=false;ring.renderOrder=20;scene.add(ring);function setPointer(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1}function hitRock(e){setPointer(e);raycaster.setFromCamera(pointer,camera);return raycaster.intersectObject(rock,false)[0]||null}function showBrush(hit){if(!hit){ring.visible=false;return}ring.visible=true;ring.position.copy(hit.point);ring.scale.setScalar(brush);ring.lookAt(camera.position)}function sculpt(hit){const geo=rock.geometry,pos=geo.attributes.position,normal=geo.attributes.normal,localHit=rock.worldToLocal(hit.point.clone()),v=new THREE.Vector3(),n=new THREE.Vector3(),radius=brush,strength=power;for(let i=0;i<pos.count;i++){v.fromBufferAttribute(pos,i);const d=v.distanceTo(localHit);if(d>radius)continue;const falloff=Math.pow(1-d/radius,2);n.fromBufferAttribute(normal,i).normalize();if(tool==='carve')v.addScaledVector(n,-strength*falloff);else if(tool==='raise')v.addScaledVector(n,strength*falloff);else{const target=localHit.clone().addScaledVector(n,d*.12);v.lerp(target,Math.min(.14,strength*1.5)*falloff)}pos.setXYZ(i,v.x,v.y,v.z)}pos.needsUpdate=true;geo.computeVertexNormals();geo.computeBoundingSphere()}renderer.domElement.addEventListener('pointerdown',e=>{down=true;const hit=hitRock(e);sculpting=!!hit;controls.enabled=!sculpting;if(hit){sculpt(hit);showBrush(hit)}renderer.domElement.setPointerCapture?.(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{const hit=hitRock(e);showBrush(hit);if(down&&sculpting&&hit)sculpt(hit)});renderer.domElement.addEventListener('pointerup',e=>{down=false;sculpting=false;controls.enabled=true;renderer.domElement.releasePointerCapture?.(e.pointerId)});renderer.domElement.addEventListener('pointerleave',()=>{if(!down)ring.visible=false});document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))}));const size=document.querySelector('#size'),powerEl=document.querySelector('#power');size.addEventListener('input',()=>{brush=+size.value;document.querySelector('#sizeVal').textContent=brush.toFixed(2)});powerEl.addEventListener('input',()=>{power=+powerEl.value;document.querySelector('#powerVal').textContent=power.toFixed(3)});document.querySelector('#reset').addEventListener('click',()=>{rock.geometry.attributes.position.array.set(original);rock.geometry.attributes.position.needsUpdate=true;rock.geometry.computeVertexNormals();rock.geometry.computeBoundingSphere()});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
