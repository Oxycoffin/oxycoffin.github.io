<body>
<div id="app"></div><div class="grain"></div>
<div class="header"><div><div class="brand">STONE</div><div class="subtitle">1 dedo = esculpir · 2 dedos = orbitar + zoom · modo Rotate = orbitar con 1 dedo</div></div></div>
<div class="topbar"><button class="btn" id="saveBtn">Save</button><button class="btn" id="undoBtn">Undo</button><button class="btn" id="resetBtn">Reset</button></div>
<div class="badge">soft clay sculpting · flatten + smooth · auto anti-collapse</div>
<div class="controls"><div class="panel sliders"><div class="label">Size</div><input id="size" type="range" min="0.16" max="0.95" step="0.01" value="0.38" /><div id="sizeVal" class="val">0.38</div><div class="label">Force</div><input id="force" type="range" min="0.003" max="0.040" step="0.001" value="0.013" /><div id="forceVal" class="val">0.013</div><div class="densityWrap label">Clay</div></div><div class="panel tools"><button data-tool="carve" class="tool active">Carve</button><button data-tool="build" class="tool">Build</button><button data-tool="smooth" class="tool">Smooth</button><button data-tool="flatten" class="tool">Flatten</button><button data-tool="rotate" class="tool">Rotate</button></div></div>
<div id="toast" class="toast"></div><div id="error" class="error">Este navegador no ha podido iniciar WebGL para STONE.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const errorEl=document.getElementById('error');const toastEl=document.getElementById('toast');const toast=msg=>{toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1200)};
try{
const host=document.getElementById('app');const scene=new THREE.Scene();scene.background=null;const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf2edde,0x0a1020,1.55));const key=new THREE.DirectionalLight(0xffffff,2.7);key.position.set(4,5,4);scene.add(key);const fill=new THREE.DirectionalLight(0x7f95ff,.8);fill.position.set(-3,1,-3);scene.add(fill);const kick=new THREE.DirectionalLight(0xffe3ba,.55);kick.position.set(0,-2,2);scene.add(kick);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(5.4,80),new THREE.ShadowMaterial({color:0x000000,opacity:.26}));shadow.rotation.x=-Math.PI/2;shadow.position.y=-2.26;shadow.receiveShadow=true;scene.add(shadow);
const group=new THREE.Group();scene.add(group);const detail=6;const geo=new THREE.IcosahedronGeometry(1.88,detail);geo.deleteAttribute('uv');const pos=geo.attributes.position;const idx=geo.index.array;const count=pos.count;const dirs=new Array(count);const baseR=new Float32Array(count);const radii=new Float32Array(count);const work=new Float32Array(count*3);const adj=Array.from({length:count},()=>new Set());const tmp=new THREE.Vector3();const seeded=(x,y,z)=>Math.sin(x*2.2+y*1.3+z*.7)*.045+Math.sin(x*5.2-y*2+z*1.9)*.02+Math.cos(x*8.1+y*6-z*4.1)*.008;
for(let i=0;i<count;i++){tmp.fromBufferAttribute(pos,i).normalize();dirs[i]=tmp.clone();const n=dirs[i];const r=1.74+seeded(n.x,n.y,n.z)+n.y*.025-Math.max(0,n.z)*.02;baseR[i]=r;radii[i]=r}for(let i=0;i<idx.length;i+=3){const a=idx[i],b=idx[i+1],c=idx[i+2];adj[a].add(b);adj[a].add(c);adj[b].add(a);adj[b].add(c);adj[c].add(a);adj[c].add(b)}
const mat=new THREE.MeshStandardMaterial({color:0xd7cfbf,roughness:.98,metalness:.01});const rock=new THREE.Mesh(geo,mat);rock.castShadow=true;rock.receiveShadow=true;group.add(rock);group.rotation.set(.14,-.58,0);
const ring=new THREE.Mesh(new THREE.RingGeometry(.94,1,64),new THREE.MeshBasicMaterial({color:0xc9f15b,side:THREE.DoubleSide,transparent:true,opacity:.78,depthTest:false}));ring.visible=false;ring.renderOrder=20;scene.add(ring);const normalLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,1)]),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.24}));normalLine.visible=false;scene.add(normalLine);
function writeMesh(){for(let i=0;i<count;i++){const d=dirs[i],r=radii[i],o=i*3;work[o]=d.x*r;work[o+1]=d.y*r;work[o+2]=d.z*r}pos.array.set(work);pos.needsUpdate=true;geo.computeVertexNormals()}writeMesh();
let yaw=-.58,pitch=.18,distance=6.4;function updateCamera(){const cp=Math.cos(pitch);camera.position.set(Math.sin(yaw)*cp*distance,Math.sin(pitch)*distance,Math.cos(yaw)*cp*distance);camera.lookAt(0,0,0)}updateCamera();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const lerp=THREE.MathUtils.lerp;const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();const activePointers=new Map();let tool='carve',brush=.38,force=.013,isSculpting=false,orbiting=false,pendingHit=null,sculptQueued=false,pinchStart=null,lastSingle={x:0,y:0};const undoStack=[];const MAX_UNDO=30;
function snapshot(){undoStack.push(radii.slice());if(undoStack.length>MAX_UNDO)undoStack.shift()}function restore(arr){radii.set(arr);relaxSurface(2,.2);writeMesh()}function setPointer(x,y){const r=renderer.domElement.getBoundingClientRect();pointer.x=((x-r.left)/r.width)*2-1;pointer.y=-((y-r.top)/r.height)*2+1}function hitTest(x,y){setPointer(x,y);raycaster.setFromCamera(pointer,camera);return raycaster.intersectObject(rock,false)[0]||null}
function showBrush(hit){if(!hit){ring.visible=false;normalLine.visible=false;return}ring.visible=tool!=='rotate';ring.position.copy(hit.point);ring.scale.setScalar(brush);ring.lookAt(camera.position);normalLine.visible=tool!=='rotate';const p0=hit.point,p1=hit.point.clone().add(hit.face.normal.clone().transformDirection(rock.matrixWorld).multiplyScalar(.35));normalLine.geometry.setFromPoints([p0,p1])}function smoothstep01(t){return t*t*(3-2*t)}

function limitGradient(){const lim=.055;for(let pass=0;pass<2;pass++){for(let i=0;i<count;i++){for(const n of adj[i]){const diff=radii[i]-radii[n];if(diff>lim){const corr=(diff-lim)*.35;radii[i]-=corr;radii[n]+=corr}else if(diff<-lim){const corr=(-diff-lim)*.35;radii[i]+=corr;radii[n]-=corr}}radii[i]=clamp(radii[i],1.2,2.24)}}}function localAverage(index){let sum=radii[index],c=1;for(const n of adj[index]){sum+=radii[n];c++}return sum/c}
function sculptAt(hit){if(!hit)return;const localHit=rock.worldToLocal(hit.point.clone()).normalize();const cosRadius=Math.cos(brush*.72);if(tool==='flatten'){let target=0,weightSum=0;for(let i=0;i<count;i++){const dot=dirs[i].dot(localHit);if(dot<cosRadius)continue;const distNorm=(1-dot)/(1-cosRadius+1e-6),w=smoothstep01(Math.max(0,1-distNorm));target+=radii[i]*w;weightSum+=w}target=weightSum?target/weightSum:1.65;const next=radii.slice();for(let i=0;i<count;i++){const dot=dirs[i].dot(localHit);if(dot<cosRadius)continue;const distNorm=(1-dot)/(1-cosRadius+1e-6),w=smoothstep01(Math.max(0,1-distNorm));next[i]=lerp(radii[i],target,Math.min(.42,w*(force*18)))}radii.set(next)}else if(tool==='smooth'){const next=radii.slice();for(let i=0;i<count;i++){const dot=dirs[i].dot(localHit);if(dot<cosRadius)continue;const distNorm=(1-dot)/(1-cosRadius+1e-6),w=smoothstep01(Math.max(0,1-distNorm)),avg=localAverage(i);next[i]=lerp(radii[i],avg,Math.min(.48,w*(force*24+.03)))}radii.set(next)}else{const sign=tool==='carve'?-1:1;for(let i=0;i<count;i++){const dot=dirs[i].dot(localHit);if(dot<cosRadius)continue;const distNorm=(1-dot)/(1-cosRadius+1e-6),falloff=smoothstep01(Math.max(0,1-distNorm)),delta=sign*force*falloff*(.65+.35*falloff);radii[i]=clamp(radii[i]+delta,1.2,2.24)}}relaxSurface(tool==='smooth'?2:3,tool==='flatten'?.16:.12+force*1.8);limitGradient();writeMesh()}
function saveToLocal(){localStorage.setItem('stone-v4-radii',JSON.stringify(Array.from(radii)));toast('Saved')}function loadFromLocal(){const raw=localStorage.getItem('stone-v4-radii');if(!raw)return false;try{const arr=JSON.parse(raw);if(Array.isArray(arr)&&arr.length===count){for(let i=0;i<count;i++)radii[i]=arr[i];writeMesh();toast('Loaded');return true}}catch{}return false}
document.querySelectorAll('[data-tool]').forEach(btn=>btn.addEventListener('click',()=>{tool=btn.dataset.tool;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b===btn));if(tool==='rotate'){ring.visible=false;normalLine.visible=false}}));const sizeEl=document.getElementById('size'),forceEl=document.getElementById('force');sizeEl.addEventListener('input',()=>{brush=+sizeEl.value;document.getElementById('sizeVal').textContent=brush.toFixed(2)});forceEl.addEventListener('input',()=>{force=+forceEl.value;document.getElementById('forceVal').textContent=force.toFixed(3)});document.getElementById('saveBtn').addEventListener('click',saveToLocal);document.getElementById('undoBtn').addEventListener('click',()=>{const prev=undoStack.pop();if(prev){restore(prev);toast('Undo')}});document.getElementById('resetBtn').addEventListener('click',()=>{snapshot();radii.set(baseR);writeMesh();toast('Reset')});
function onDown(e){activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});renderer.domElement.setPointerCapture?.(e.pointerId);const pts=[...activePointers.values()];if(pts.length===1){lastSingle={x:e.clientX,y:e.clientY};const hit=hitTest(e.clientX,e.clientY);showBrush(hit);if(tool!=='rotate'&&hit){snapshot();isSculpting=true;pendingHit=hit;sculptQueued=true}else orbiting=true}else if(pts.length===2){isSculpting=false;orbiting=false;ring.visible=false;normalLine.visible=false;const[a,b]=pts,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;pinchStart={distance:Math.hypot(b.x-a.x,b.y-a.y),angle:Math.atan2(b.y-a.y,b.x-a.x),yaw,pitch,distanceCam:distance,cx,cy}}}
function onMove(e){if(activePointers.has(e.pointerId))activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...activePointers.values()];if(!pts.length)return;if(pts.length===1){const p=pts[0],hit=hitTest(p.x,p.y);showBrush(hit);if(isSculpting&&tool!=='rotate'){pendingHit=hit;sculptQueued=true}else if(orbiting||tool==='rotate'){const dx=p.x-lastSingle.x,dy=p.y-lastSingle.y;yaw-=dx*.01;pitch=clamp(pitch-dy*.01,-1.18,1.18);updateCamera();lastSingle=p}}else{const[a,b]=pts,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,dist=Math.hypot(b.x-a.x,b.y-a.y),ang=Math.atan2(b.y-a.y,b.x-a.x);if(pinchStart){yaw=pinchStart.yaw-(cx-pinchStart.cx)*.004-(ang-pinchStart.angle)*.22;pitch=clamp(pinchStart.pitch-(cy-pinchStart.cy)*.004,-1.18,1.18);distance=clamp(pinchStart.distanceCam*(pinchStart.distance/Math.max(40,dist)),4.25,9);updateCamera()}}}

}catch(err){console.error(err);errorEl.classList.add('show')}
