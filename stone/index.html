<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c0e" />
  <title>STONE — Sculpt a Rock</title>
  <meta name="description" content="A tactile 3D stone sculpting toy." />
  <link rel="stylesheet" href="./styles.css?v=2" />
</head>
<body>
  <canvas id="stage" aria-label="Interactive 3D stone"></canvas>
  <div class="noise" aria-hidden="true"></div>

  <header class="topbar">
    <div class="identity">
      <span class="wordmark">STONE</span>
      <span class="version">SCULPT / 02</span>
    </div>
    <div class="actions">
      <button class="icon-button" id="undo" type="button" disabled aria-label="Undo">Undo</button>
      <button class="icon-button" id="reset" type="button" aria-label="Reset stone">Reset</button>
    </div>
  </header>

  <div class="help">
    <b>1 finger / mouse</b> — sculpt<br />
    <b>drag outside</b> — orbit<br />
    <b>2 fingers</b> — orbit + zoom
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <div class="controls">
    <div class="tool-dock" role="group" aria-label="Sculpting tools">
      <button class="tool active" type="button" data-tool="carve" data-label="Carve" aria-pressed="true">Carve</button>
      <button class="tool" type="button" data-tool="raise" data-label="Build" aria-pressed="false">Build</button>
      <button class="tool" type="button" data-tool="smooth" data-label="Smooth" aria-pressed="false">Smooth</button>
      <button class="tool" type="button" data-tool="orbit" data-label="Rotate" aria-pressed="false">Rotate</button>
    </div>

    <div class="brush-panel" aria-label="Brush settings">
      <div class="slider-row">
        <label for="brush-size">Size</label>
        <input id="brush-size" type="range" min="0.16" max="0.72" step="0.01" value="0.36" />
        <output id="brush-size-value" for="brush-size">0.36</output>
      </div>
      <div class="slider-row">
        <label for="brush-strength">Force</label>
        <input id="brush-strength" type="range" min="0.006" max="0.050" step="0.002" value="0.020" />
        <output id="brush-strength-value" for="brush-strength">0.020</output>
      </div>
    </div>
  </div>

  <div id="error" hidden>
    <strong></strong>
    <span></span>
  </div>

  <script type="module" src="./app.js?v=2"></script>
</body>
</html>
