name: Bruma browser regression
on:
  push:
    branches: [main]
    paths: ['bruma/**']
  pull_request:
    paths: ['bruma/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bruma-browser-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real test browsers
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Check JavaScript syntax
        run: |
          node --check bruma/main-v2.js
          node --check bruma/puzzles-v2.js
          node --check bruma/renderer.js
      - name: Play the game and collect visual evidence
        env:
          BRUMA_QA_OUT: bruma-qa-results
        run: python bruma/qa/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bruma-browser-review
          path: bruma-qa-results/
          retention-days: 7
