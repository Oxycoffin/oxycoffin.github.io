name: Bruma repair verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bruma-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bruma-repair-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage candidate without publishing
        shell: python
        run: |
          import urllib.request,hashlib,zipfile,io,pathlib
          url='https://at.adobe.com/MdBH4mevPP8D4Hpo'
          with urllib.request.urlopen(url,timeout=90) as r: payload=r.read()
          assert hashlib.sha256(payload).hexdigest()=='22447c6892f8776e7235b6dad59f47452f53d83e452d41fd41226537b5e8da61', 'Candidate integrity mismatch'
          allowed={'index.html','renderer.js','style-v2.css','main-v2.js','puzzles-v2.js','REVISION.md','qa/browser_check.py'}
          z=zipfile.ZipFile(io.BytesIO(payload))
          assert set(z.namelist())==allowed
          for n in z.namelist():
              p=pathlib.Path('bruma')/n
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(z.read(n))
          print('Candidate staged; public files remain unchanged.')
      - name: Install test browsers
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: JavaScript syntax checks
        run: |
          node --check bruma/main-v2.js
          node --check bruma/puzzles-v2.js
          node --check bruma/renderer.js
      - name: Playthrough and visual regression
        env:
          BRUMA_QA_OUT: bruma-qa-results
        run: python bruma/qa/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bruma-repair-review
          path: |
            bruma-qa-results/
            bruma/
          retention-days: 5
