<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="theme-color" content="#041319">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="TIDEFOLD: duelo abstracto de corrientes concéntricas, floraciones y estrategia contra IA local.">
  <meta property="og:title" content="TIDEFOLD — un duelo de corrientes vivas">
  <meta property="og:description" content="Siembra una célula, pliega dos corrientes y provoca tres floraciones antes que la IA.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="mark.svg">
  <title>TIDEFOLD · Estrategia contra IA</title>
  <link rel="icon" href="mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <main class="app" id="app">
    <header class="hud-top">
      <button class="brand" id="brandButton" type="button" aria-label="Abrir información de TIDEFOLD">
        <span class="brand-orbit" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>TIDEFOLD</span>
      </button>

      <section class="scoreboard" aria-label="Marcador">
        <div class="score lumen"><span class="score-dot"></span><b id="humanScore">0</b><small data-i18n="lumen">Lumen</small></div>
        <div class="score-goal">/ 3</div>
        <div class="score coral"><span class="score-dot"></span><b id="aiScore">0</b><small data-i18n="coral">Coral</small></div>
      </section>

      <div class="top-actions">
        <button class="icon-button" id="undoButton" type="button" aria-label="Deshacer" title="Deshacer">↶</button>
        <button class="icon-button" id="menuButton" type="button" aria-label="Menú" title="Menú">•••</button>
      </div>
    </header>

    <section class="game-stage" aria-label="Campo de TIDEFOLD">
      <div class="status-pill" id="statusPill" aria-live="polite"><span class="pulse-dot"></span><span id="statusText">Tu turno · siembra una célula</span></div>

      <div class="board-shell" id="boardShell">
        <div class="ambient-ring r3" aria-hidden="true"></div>
        <div class="ambient-ring r2" aria-hidden="true"></div>
        <div class="ambient-ring r1" aria-hidden="true"></div>
        <div class="spokes" id="spokes" aria-hidden="true"></div>
        <div class="ring-layer ring-2" id="ring2"></div>
        <div class="ring-layer ring-1" id="ring1"></div>
        <div class="ring-layer ring-0" id="ring0"></div>
        <div class="ghost-layer" id="ghostLayer" aria-hidden="true"></div>
        <div class="bloom-layer" id="bloomLayer" aria-hidden="true"></div>

        <div class="core-hud" id="coreHud">
          <span class="core-mark" aria-hidden="true"></span>
          <strong id="coreLabel">SIEMBRA</strong>
          <small id="coreDetail">elige una cámara vacía</small>
        </div>

        <button class="fold-control seam0 dir-plus" data-seam="0" data-dir="1" type="button" aria-label="Interior horario, medio antihorario">
          <span class="fold-icon"><b>↻</b><i>↺</i></span><small>01</small>
        </button>
        <button class="fold-control seam0 dir-minus" data-seam="0" data-dir="-1" type="button" aria-label="Interior antihorario, medio horario">
          <span class="fold-icon"><b>↺</b><i>↻</i></span><small>01</small>
        </button>
        <button class="fold-control seam1 dir-plus" data-seam="1" data-dir="1" type="button" aria-label="Medio horario, exterior antihorario">
          <span class="fold-icon"><b>↻</b><i>↺</i></span><small>12</small>
        </button>
        <button class="fold-control seam1 dir-minus" data-seam="1" data-dir="-1" type="button" aria-label="Medio antihorario, exterior horario">
          <span class="fold-icon"><b>↺</b><i>↻</i></span><small>12</small>
        </button>

        <div class="direction-arrow" id="arrowA" aria-hidden="true"></div>
        <div class="direction-arrow" id="arrowB" aria-hidden="true"></div>
      </div>

      <div class="fold-caption" id="foldCaption" aria-live="polite"></div>
    </section>

    <nav class="dock" aria-label="Acciones de partida">
      <button id="hintButton" type="button"><span>✦</span><small data-i18n="hint">Pista</small></button>
      <button id="historyButton" type="button"><span>≣</span><small data-i18n="history">Historial</small></button>
      <button class="dock-primary" id="newButton" type="button"><span>＋</span><small data-i18n="newGame">Nueva</small></button>
      <button id="rulesButton" type="button"><span>?</span><small data-i18n="rules">Reglas</small></button>
      <button id="settingsButton" type="button"><span>⌁</span><small data-i18n="settings">Ajustes</small></button>
    </nav>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header><div><span class="eyebrow" id="sheetEyebrow">FIELD SYSTEM 021</span><h2 id="sheetTitle">TIDEFOLD</h2></div><button id="sheetClose" class="icon-button" type="button" aria-label="Cerrar">×</button></header>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="engine.js?v=2"></script>
  <script src="game.js?v=2"></script>
</body>
</html>
